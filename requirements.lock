# Exact versions behind every number in the README.
#
# Not a hand-curated list: generated from the virtualenv that produced
# results/, with `pip freeze --exclude-editable`. pyproject.toml carries the
# loose ranges a library should declare; this file carries the one resolution
# the published metrics came out of, so a reader can reproduce 0.2748 rather
# than whatever the ranges resolve to next month.
#
# Regenerate after changing a dependency:
#
#     python3.11 -m venv .venv && source .venv/bin/activate
#     pip install -e ".[dev]"
#     scripts/lock.sh
#
# jax and jaxlib resolve to per-platform wheels at the pinned version; the
# versions here are what CI (linux x86_64) and a Mac (arm64) both install.
#
# sportio is pinned to a commit, not a branch: it is my own package and a
# branch pin would let it move under the metrics.
