[project]
name = "xg-jax"
version = "0.1.0"
description = "Shot-level expected goals models in JAX, validated and calibrated on StatsBomb open data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton", email = "daltonoscar0@gmail.com" }]
keywords = ["soccer", "football", "expected-goals", "jax", "equinox", "calibration"]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "typer>=0.12",
    "sportio @ git+https://github.com/daltonoscar0/sportio.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
xg = "xg.cli:main"

[project.urls]
Homepage = "https://github.com/daltonoscar0/xg-jax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as argument defaults; that is the library's whole idiom.
"src/xg/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
