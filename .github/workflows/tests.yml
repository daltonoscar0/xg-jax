name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # From the lock, not from the ranges in pyproject.toml: the point of CI
      # here is that the metrics in the README stay reproducible, and a run
      # against whatever the ranges resolve to this month does not test that.
      # `--no-deps` on the project itself so pip cannot quietly upgrade past a
      # pin to satisfy it; `pip check` then confirms the closure is consistent,
      # which is how a dependency added to pyproject.toml without regenerating
      # the lock gets caught.
      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip check

      - name: Lint
        run: ruff check src tests scripts

      # No network and no StatsBomb data: every test runs off the committed synthetic
      # fixture in tests/fixtures/. Redistributing the real data would breach clause
      # 1.2.1 of the StatsBomb Public Data User Agreement.
      - name: Tests
        run: pytest -q

      - name: Fixture is reproducible from its generator
        run: |
          python tests/make_fixtures.py
          git diff --exit-code tests/fixtures/
